# Windows and Linux bundles. A v* tag puts them in a draft release, which
# scripts/release.sh completes on a Mac: it adds the signed, notarized Mac
# build, signs every update and publishes. The signing keys stay on that Mac,
# so this workflow needs no secrets.
name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # Let one platform finish even when the other fails.
      fail-fast: false
      matrix:
        include:
          # Only the per-user installer: it updates itself silently, where
          # an .msi installs for all users and needs an administrator.
          - platform: windows
            os: windows-latest
            bundles: nsis
            extensions: exe
          # Tauri's documented Linux runner. Its older glibc lets the
          # AppImage run on more distributions.
          - platform: linux
            os: ubuntu-22.04
            bundles: appimage,deb
            extensions: AppImage deb
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Read the app version
        id: version
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            # The installers take their version from tauri.conf.json, so a
            # release tag that says otherwise would mislabel them.
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in src-tauri/tauri.conf.json"
              exit 1
            fi
            label=$version
          else
            # Untagged builds also name the commit, so testers can tell them apart.
            label=$version-${GITHUB_SHA::7}
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

      # The WebKitGTK webview, the tray icon (appindicator) and SVG icon
      # loading (rsvg) need system libraries; patchelf and xdg-utils are used
      # when packing the AppImage. The plugins need nothing more: global
      # shortcuts use X11, which comes with GTK, and keep-awake and
      # single-instance talk to D-Bus in pure Rust.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install npm packages
        run: npm ci

      - name: Build the frontend
        run: npm run build

      # The frontend was built in the step above, so skip Tauri's own
      # beforeBuildCommand. --locked keeps Cargo to the committed lockfile.
      - name: Build the ${{ matrix.platform }} bundles
        run: node_modules/.bin/tauri build --bundles ${{ matrix.bundles }} --config '{"build":{"beforeBuildCommand":null}}' -- --locked

      - name: Collect the bundles
        run: |
          mkdir out
          for ext in ${{ matrix.extensions }}; do
            files=$(find src-tauri/target/release/bundle -maxdepth 2 -type f -name "*.$ext")
            if [ -z "$files" ]; then
              echo "::error::No .$ext bundle was built"
              exit 1
            fi
            cp $files out/
          done
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tonewell-${{ steps.version.outputs.label }}-${{ matrix.platform }}-x64
          path: out/
          if-no-files-found: error
          # Installers and AppImages are already compressed.
          compression-level: 0

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and upload to it.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tonewell-*
          path: out
          merge-multiple: true

      # Always a draft: it is published by hand after a look. A release that
      # is already published is never touched.
      - name: Attach the bundles to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l out
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published; not changing it"
              exit 1
            fi
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --draft --verify-tag --title "Tonewell $TAG" \
              --notes "Download Tonewell from https://tonewell.space. The Windows installer isn't signed yet, so Windows may say it's from an unknown publisher: choose More info, then Run anyway."
          fi
