<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The macOS icon grid: an 824 x 824 body centred on a 1024 canvas, corner radius 185.
       Ripples around a point of light, the same drop in a well as the player's light. -->
  <defs>
    <radialGradient id="deep" cx="50%" cy="46%" r="62%">
      <stop offset="0" stop-color="#151A33"/>
      <stop offset="1" stop-color="#0B0E1A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#AFC0FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#AFC0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#deep)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#2A3150" stroke-width="3"/>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#AFC0FF" stroke-opacity=".10" stroke-width="10"/>
  <circle cx="512" cy="512" r="220" fill="none" stroke="#AFC0FF" stroke-opacity=".24" stroke-width="12"/>
  <circle cx="512" cy="512" r="140" fill="none" stroke="#AFC0FF" stroke-opacity=".55" stroke-width="14"/>
  <circle cx="512" cy="512" r="150" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="58" fill="#DCE3FF"/>
</svg>
